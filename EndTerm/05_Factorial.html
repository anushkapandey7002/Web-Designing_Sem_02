<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            width: 400px;
            margin: auto;
            padding: 20px;
            background: white;
            border: 2px solid black;
            border-radius: 10px;
        }
        h2 {
            margin-bottom: 20px;
        }

        input, button {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            color: blue;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Factorial Calculator</h2>

    <input type="number" id="num" placeholder="Enter a Number">

    <button onclick="findFactorial()">Calculate Factorial</button>

    <p id="result"></p>
</div>

<script>
function findFactorial() {
    let n = parseInt(document.getElementById("num").value);
    let fact = 1;

    for(let i = 1; i <= n; i++) {
        fact = fact * i;
    }
    document.getElementById("result").innerHTML =
        "Factorial of " + n + " = " + fact;
}
</script>

</body>
</html>
